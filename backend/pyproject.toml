[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-knowledge-assistant"
version = "0.1.0"
description = "Local document retrieval and grounded answers with Ollama"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1", "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1", "pypdf>=6.1,<7", "numpy>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]